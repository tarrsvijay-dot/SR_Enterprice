spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sr_enterprises}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  error: { include-message: never }
app:
  jwt-secret: ${JWT_SECRET:development-secret-must-be-replaced-with-64-characters-minimum-please}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  initial-admin-email: ${INITIAL_ADMIN_EMAIL:tarrsanvijay19@gmail.com}
  initial-admin-password: ${INITIAL_ADMIN_PASSWORD:}

